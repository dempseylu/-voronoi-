# Database connection.
# Keep db.password empty here and pass VORONOI_DB_PASSWORD in the environment.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/yy?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
db.username=root
db.password=

# Where station and user records come from by default: "db" or "csv:<path>".
stations.source=db
users.source=db

# Output file and Voronoi clipping margin (fraction of the station bounding box).
output=out/cells.geojson
clip.margin=0.05
